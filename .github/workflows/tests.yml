name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mido (enables the cross-check tests)
        run: python -m pip install --upgrade pip mido
      - name: Functional tests (98)
        run: python tests/test_midikit.py
      - name: Hardening tests (36)
        run: python tests/test_verification.py
      - name: Built-in selftest
        run: python midi.py selftest --text
      - name: Command line smoke test
        run: python midi.py info examples/demo.mid --text
